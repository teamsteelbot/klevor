    - Videos: videos.md
    - Software: software.md
    - Gadgets: gadgets.md
    - Patrocinadores: sponsors.md
    - Contacto: contact.md
extra_css:
    - stylesheets/extra.css
extra:
    alternate:
        - name: English
          link: /en/
          lang: en
        - name: Español
          link: /es/
          lang: es
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/teamsteelbot
          name: Team Steel Bot en GitHub
        - icon: fontawesome/brands/instagram
          link: https://instagram.com/teamsteelbotsa
          name: Team Steel Bot en Instagram
        - icon: fontawesome/brands/telegram
          link: https://t.me/ralvarezdev
          name: Capitán del Team Steel Bot en Telegram
        - icon: fontawesome/solid/paper-plane
          link: mailto:<inquiries@ralvarez.dev>
          name: Contáctanos por Email
copyright:
    Copyright &copy; 2025 Team Steel Bot. Todos los derechos reservados.
    Muchas gracias a Viajes Giorgio, Nathaly's Star y Steel C.A. por
    patrocinar a nuestro equipo.
markdown_extensions:
    - attr_list
    - admonition
    - nl2br
plugins:
    - platform-content
    - search
    - callouts
    - mkdocstrings:
        handlers:
            python:
                options:
                    show_root_toc_entry: true
                    show_root_full_path: false
                    show_submodules: true
    - i18n:
        docs_structure: suffix
        languages:
            - locale: en
              name: English
              build: true
              site_description: Klevor is the official documentation of the Team Steel Bot for the
                  World Robot Olympiad (WRO) competition in 2025.
              theme:
                  palette:
                      - media: "(prefers-color-scheme)"
                        toggle:
                            name: Switch to light mode

                      - media: "(prefers-color-scheme: light)"
                        toggle:
                            name: Switch to dark mode

                      - media: "(prefers-color-scheme: dark)"
                        toggle:
                            name: Switch to light mode
              extra:
                  social:
                    - icon: fontawesome/brands/github
                      name: Team Steel Bot on GitHub
                    - icon: fontawesome/brands/instagram
                      name: Team Steel Bot on Instagram
                    - icon: fontawesome/brands/telegram
                      name: Team Steel Bot Captain on Telegram
                    - icon: fontawesome/solid/paper-plane
                      name: Contact Us via Email
              copyright:
                  Copyright &copy; 2025 Team Steel Bot. All rights reserved.
                  Special thanks to Viajes Giorgio, Nathaly's Star and Steel C.A. for
                  sponsoring our team.
