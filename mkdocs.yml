site_name: Klevor
repo_url: https://github.com/teamsteelbot/klevor/
repo_name: Klevor
edit_uri: edit/main/docs/
site_description: Klevor es la documentación oficial del equipo Steel Bot 
  para la competencia de la World Robot Olympiad (WRO).
site_author: Equipo Steel Bot
use_directory_urls: false
theme:
  name: material
  logo: assets/images/logo/teamsteelbot.png
  favicon: assets/images/favicon/favicon.ico
  language: es
  features:
    - header.autohide
    - navigation.footer
  font:
    code: Fira Code
    text: Fira Sans
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon:  material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  - Inicio: index.md
  - Nosotros: about.md
  - Electrónica:
    - Componentes:
      - Actuales: electronic/components/current.md
      - Previos: electronic/components/previous.md
    - Diagramas:
      - Diagramas de Conexiones: electronic/diagrams/wiring.md
  - Mecánica:
    - Piezas:
      - Piezas 3D Comunes: mechanical/parts/common.md
      - Piezas del Prototipo 1: mechanical/parts/prototype1.md
      - Piezas del Prototipo 2: mechanical/parts/prototype2.md
      - Piezas del Prototipo 3: mechanical/parts/prototype3.md
    - Prototipos:
      - Prototipo 1: mechanical/prototypes/prototype1.md
      - Prototipo 2: mechanical/prototypes/prototype2.md
      - Prototipo 3: mechanical/prototypes/prototype3.md
  - Programación:
    - Lenguajes: programming/languages.md
    - Librerías: programming/libraries.md
    - Diagramas:
        - Diagramas de Flujo: programming/diagrams/flowcharts.md
    - Glosario de Términos: programming/glossary.md
    - Guías:
        - Guía de MkDocs: programming/guides/mkdocs.md
        - Guía de CircuitPython: programming/guides/circuit-python.md
        - Guía de MicroPython: programming/guides/micro-python.md
        - Guía de Raspberry Pi: programming/guides/raspberry-pi.md
        - Guía de Detección de Objetos: programming/guides/object-detection.md
    - Referencia del Código:
        - Raspberry Pi 5:
            - Args: programming/code/raspberry-pi-5/args.md
            - Camera: programming/code/raspberry-pi-5/camera.md
            - Common: programming/code/raspberry-pi-5/common.md
            - Files: programming/code/raspberry-pi-5/files.md
            - Hailo: programming/code/raspberry-pi-5/hailo.md
            - Log: programming/code/raspberry-pi-5/log.md
            - Model: programming/code/raspberry-pi-5/model.md
            - OpenCV: programming/code/raspberry-pi-5/opencv.md
            - Pilot: programming/code/raspberry-pi-5/pilot.md
            - Plot: programming/code/raspberry-pi-5/plot.md
            - RPLiDAR: programming/code/raspberry-pi-5/rplidar.md
            - Serial Communication: programming/code/raspberry-pi-5/serial-communication.md
            - Server: programming/code/raspberry-pi-5/server.md
            - Spawner: programming/code/raspberry-pi-5/spawner.md
            - Utils: programming/code/raspberry-pi-5/utils.md
            - YOLO: programming/code/raspberry-pi-5/yolo.md
        - Raspberry Pi Pico 2W:
            - Lib: programming/code/raspberry-pi-pico-2w/lib.md
            - Code: programming/code/raspberry-pi-pico-2w/code.md
  - GitHub: github.md
  - Videos: videos.md
  - Sponsors: sponsors.md
  - Contacto: contact.md
extra_css:
  - stylesheets/extra.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/teamsteelbot/klevor
      name: Equipo Steel Bot en GitHub
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/teamsteelbotsa
      name: Equipo Steel Bot en Instagram
copyright: Copyright &copy; 2025 Team Steel Bot
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - nl2br
plugins:
  - search
  - callouts
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_toc_entry: true
            show_root_full_path: false
            show_submodules: true