site_name: Klevor
repo_url: https://github.com/teamsteelbot/klevor/
repo_name: Klevor
edit_uri: edit/main/docs/
site_description: Klevor es la documentación oficial del equipo Steel Bot 
    para la competencia de la World Robot Olympiad (WRO) de 2025.
site_author: Team Steel Bot
site_dir: site
use_directory_urls: false
theme:
    name: material
    logo: assets/images/logo/teamsteelbot.png
    favicon: assets/images/favicon/favicon.ico
    features:
        - header.autohide
        - navigation.footer
    font:
        code: Fira Code
        text: Fira Sans
    icon:
        repo: fontawesome/brands/github
    palette:
        # Palette toggle for automatic mode
        - media: "(prefers-color-scheme)"
          toggle:
              icon: material/brightness-auto
              name: Cambiar al modo claro

        # Palette toggle for light mode
        - media: "(prefers-color-scheme: light)"
          scheme: default
          toggle:
              icon: material/brightness-7
              name: Cambiar al modo oscuro

        # Palette toggle for dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          toggle:
              icon: material/brightness-4
              name: Cambiar al modo claro
nav:
    - Inicio: index.md
    - Sobre Nosotros: about.md
    - GitHub: github.md
    - Electrónica:
        - Componentes:
            - Componentes Previos: electronic/components/previous.md
            - Componentes Actuales: electronic/components/current.md
            - Componentes Futuros: electronic/components/future.md
        - Diagramas:
            - Diagramas de Conexiones: electronic/diagrams/wiring.md
    - Mecánica:
        - Piezas:
            - Piezas Comunes:
                - Piezas Comunes Previas: mechanical/parts/common/previous.md
                - Piezas Comunes Actuales: mechanical/parts/common/current.md
            - Piezas del Prototipo 1: mechanical/parts/prototype1.md
            - Piezas del Prototipo 2: mechanical/parts/prototype2.md
            - Piezas del Prototipo 3: mechanical/parts/prototype3.md
        - Prototipos:
            - Prototipo 1: mechanical/prototypes/prototype1.md
            - Prototipo 2: mechanical/prototypes/prototype2.md
            - Prototipo 3: mechanical/prototypes/prototype3.md
            - Prototipo 4: mechanical/prototypes/prototype4.md
    - Programación:
        - Lenguajes de Programación:
            - Lenguaje de Programación Previos: programming/languages/previous.md
            - Lenguaje de Programación Actuales: programming/languages/current.md
            - Lenguaje de Programación Futuros: programming/languages/future.md
        - Librerías:
            - Librerías de Python: programming/libraries/python.md
            - Librerías de CircuitPython: programming/libraries/circuit-python.md
        - Diagramas:
            - Diagramas de Flujo: programming/diagrams/flowcharts.md
        - Glosario de Términos: programming/glossary.md
        - Guías:
            - Guía de MkDocs: programming/guides/mkdocs.md
            - Guía de CircuitPython: programming/guides/circuit-python.md
            - Guía de MicroPython: programming/guides/micro-python.md
            - Guía de la Raspberry Pi 5: programming/guides/raspberry-pi-5.md
            - Guía de la Raspberry Pi Pico 2W: programming/guides/raspberry-pi-pico-2w.md
            - Guía de Detección de Objetos: programming/guides/object-detection.md
        #- Referencia del Código:
        #    - Raspberry Pi 5:
        #        - Módulo Args: programming/code/raspberry-pi-5/args.md
        #        - Módulo Camera: programming/code/raspberry-pi-5/camera.md
